<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bunting" id="bunting"></div>

<div class="top-right-bar">
<button class="cart-fab" id="cartFab">
🧺 <span id="cartCount">0</span>
</button>
<a href="admin.html" class="admin-link" aria-label="Panel del administrador">·</a>
</div>

<header class="stall">
<div class="stall-inner">
<p class="eyebrow">FERIA · PUESTO ABIERTO</p>
<h1 id="siteName">Mi Tienda</h1>
<p id="siteTagline" class="tagline">Ropa con onda, directo de la feria</p>
<div class="contact-row" id="contactRow"></div>
<p id="ofertaGlobalBanner" class="oferta-banner" hidden></p>
</div>
</header>
<main id="main">
<div class="filter-bar">
<input type="text" id="searchInput" placeholder="Buscar producto...">
<select id="categoryFilter">
<option value="">Todas las categorías</option>
</select>
</div>
<div id="paused" class="empty-state" hidden>
<p>Esta tienda está pausada por ahora. Volvé pronto 🧵</p>
</div>
<div id="empty" class="empty-state" hidden>
<p>Todavía no hay productos colgados en la soga.</p>
</div>
<div id="noResults" class="empty-state" hidden>
<p>No encontramos nada con esa búsqueda.</p>
</div>
<div id="lines"></div>
</main>
<footer class="foot">
<p id="footerText">Hecho con hilo y aguja 🧵</p>
</footer>

<div class="cart-overlay" id="cartOverlay" hidden>
<div class="cart-panel">
<div class="cart-panel-head">
<h2>Tu pedido</h2>
<button class="cart-close" id="cartClose" aria-label="Cerrar">&times;</button>
</div>
<div id="cartItems" class="cart-items"></div>
<div class="cart-panel-footer">
<label for="cartNombre" class="cart-field-label">Tu nombre</label>
<input type="text" id="cartNombre" placeholder="¿Cómo te llamamos?">

<label for="cartEntrega" class="cart-field-label">Entrega</label>
<select id="cartEntrega">
<option value="envio">Envío</option>
<option value="retiro">Retiro en el local</option>
</select>

<label for="cartDireccion" class="cart-field-label" id="cartDireccionLabel">Dirección de envío</label>
<input type="text" id="cartDireccion" placeholder="Dirección de entrega">

<label for="cartPago" class="cart-field-label">Forma de pago</label>
<select id="cartPago">
<option value="efectivo">Efectivo</option>
<option value="transferencia">Transferencia</option>
<option value="credito">Tarjeta de crédito</option>
</select>
<p id="recargoNota" class="cart-recargo-nota" hidden></p>

<div class="cart-total"><span>Total</span><span id="cartTotal">$0</span></div>
<a href="#" id="cartWhatsapp" class="contact-btn cart-checkout" target="_blank" rel="noopener">Hacer pedido por WhatsApp</a>
</div>
</div>
</div>

<div class="lightbox" id="lightbox" hidden>
<button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">&times;</button>
<div class="lightbox-content" id="lightboxContent"></div>
</div>
<script src="app.js"></script>
</body>
</html>
